<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ClipForge">
  <title>ClipForge</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/" aria-label="Accueil ClipForge">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b07cff"/><stop offset="1" stop-color="#6d28d9"/></linearGradient></defs>
        <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#lg)"/>
        <rect x="20" y="13" width="24" height="38" rx="5" fill="none" stroke="#fff" stroke-width="4"/>
        <path d="M28 25v14l11-7z" fill="#fff"/>
      </svg>
      <span>Clip<b>Forge</b></span>
    </a>
    <nav>
      <span id="jobsPill" class="jobs-pill hidden"><span class="spinner"></span><span id="jobsText"></span></span>
      <a class="btn btn-ghost" href="#/live" title="Clips automatiques en direct">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3" fill="#f43f5e" stroke="#f43f5e"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/></svg>
        <span class="lbl">Live</span>
      </a>
      <a class="btn btn-ghost" href="#/compils" title="Compilations YouTube (15-25 min)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg>
        <span class="lbl">Compilations</span>
      </a>
      <a class="btn btn-ghost" href="#/bios" title="Bios et hashtags du compte">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h16M4 15h16M10 3L8 21M16 3l-2 18"/></svg>
        <span class="lbl">Bios</span>
      </a>
      <button class="btn-ghost" id="tabletBtn" title="Ouvrir sur la tablette">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M11 18h2"/></svg>
        <span class="lbl">Tablette</span>
      </button>
      <a class="btn btn-ghost" href="#/reglages" title="Réglages">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span class="lbl">Réglages</span>
      </a>
    </nav>
  </header>
  <main id="app"></main>
  <div class="toasts" id="toasts"></div>
  <script src="/static/app.js"></script>
</body>
</html>
